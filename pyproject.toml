[project]
name = "pnx_detector"
version = "0.1.0"
description = "Deep learning model for pneumonia detection from pediatric chest X-ray images"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "lightning>=2.0",
    "clearml>=1.15",
    "timm>=0.9",
    "scikit-learn>=1.3",
    "torchmetrics>=1.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "pillow>=10.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "matplotlib>=3.10.8",
    "tensorboard>=2.14",
]
# Dependencies are added in bmad-dl-ideation (Stage 1) and installed
# in bmad-dl-infra (Stage 5) via: uv sync

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

# PyTorch CUDA build - use cu124 index (compatible with CUDA 12.4+, covers 12.5)
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchvision = [{ index = "pytorch-cu124" }]
